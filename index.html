<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Harmony Flow | Advanced Music Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(145deg, #0a0a1a 0%, #12102a 50%, #1a1635 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    /* Main Player */
    .player {
      max-width: 560px;
      width: 100%;
      background: rgba(18, 16, 38, 0.7);
      backdrop-filter: blur(16px);
      border-radius: 2.5rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    /* Header */
    .player-header {
      padding: 1.5rem 1.8rem 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo i {
      font-size: 1.6rem;
      background: linear-gradient(135deg, #c084fc, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .logo h1 {
      font-size: 1.3rem;
      font-weight: 600;
      background: linear-gradient(135deg, #fff, #c4b5fd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .badge-group {
      display: flex;
      gap: 8px;
    }
    .badge {
      background: rgba(139, 92, 246, 0.2);
      padding: 0.25rem 0.7rem;
      border-radius: 30px;
      font-size: 0.65rem;
      color: #c4b5fd;
    }

    /* Visualizer (fake spectrum) */
    .visualizer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      height: 50px;
      margin: 0.5rem 2rem 0;
    }
    .viz-bar {
      width: 6px;
      height: 20px;
      background: linear-gradient(to top, #8b5cf6, #c084fc);
      border-radius: 4px;
      transition: height 0.1s ease;
    }

    /* Album Art */
    .album-section {
      text-align: center;
      padding: 0.2rem 1.5rem 0.5rem;
    }
    .art-frame {
      width: 210px;
      height: 210px;
      margin: 0 auto;
      border-radius: 1.8rem;
      overflow: hidden;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
      transition: 0.3s;
    }
    .art-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Song Details */
    .song-details {
      text-align: center;
      padding: 1rem 1.5rem 0.2rem;
    }
    .song-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: white;
      letter-spacing: -0.3px;
    }
    .song-artist {
      font-size: 0.85rem;
      color: #a0a0c8;
      margin-top: 4px;
    }

    /* Progress */
    .progress-area {
      padding: 0.8rem 1.8rem;
    }
    .progress-container {
      background: rgba(255, 255, 255, 0.1);
      height: 6px;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
    }
    .progress-fill {
      background: linear-gradient(90deg, #a78cfa, #7c3aed);
      width: 0%;
      height: 100%;
      border-radius: 10px;
    }
    .time-info {
      display: flex;
      justify-content: space-between;
      margin-top: 0.4rem;
      font-size: 0.7rem;
      color: #8a8aaa;
    }

    /* Main Controls */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      padding: 1rem 1.5rem;
    }
    .ctrl {
      background: rgba(255, 255, 255, 0.05);
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .ctrl:hover {
      background: rgba(139, 92, 246, 0.3);
      transform: scale(1.05);
    }
    .play-big {
      width: 62px;
      height: 62px;
      background: linear-gradient(145deg, #7c3aed, #a78cfa);
      font-size: 1.8rem;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
    }

    /* Extra Features Row */
    .extra-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 1.8rem 1rem;
      gap: 12px;
      flex-wrap: wrap;
    }
    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.3);
      padding: 4px 12px;
      border-radius: 30px;
    }
    .volume-wrap i {
      color: #c4b5fd;
      font-size: 0.9rem;
    }
    input[type="range"] {
      width: 90px;
      height: 4px;
      -webkit-appearance: none;
      background: rgba(255,255,255,0.2);
      border-radius: 5px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: #a78cfa;
      border-radius: 50%;
      cursor: pointer;
    }
    .repeat-mode, .shuffle-mode {
      background: rgba(255,255,255,0.05);
      border: none;
      color: #aaa;
      font-size: 0.9rem;
      padding: 6px 10px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
    }
    .repeat-mode.active, .shuffle-mode.active {
      color: #c084fc;
      background: rgba(139, 92, 246, 0.25);
    }
    .speed-btn {
      background: rgba(255,255,255,0.05);
      border: none;
      color: #c4b5fd;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Playlist Section */
    .playlist-area {
      background: rgba(0, 0, 0, 0.35);
      border-top: 1px solid rgba(255,255,255,0.05);
      margin-top: 0.7rem;
      max-height: 290px;
      overflow-y: auto;
    }
    .playlist-header {
      display: flex;
      justify-content: space-between;
      padding: 1rem 1.8rem 0.5rem;
      font-size: 0.7rem;
      color: #8a8aaa;
      letter-spacing: 1px;
    }
    .tracklist {
      list-style: none;
    }
    .track {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 1.8rem;
      cursor: pointer;
      transition: 0.2s;
      border-left: 3px solid transparent;
    }
    .track:hover {
      background: rgba(139, 92, 246, 0.1);
    }
    .track.active-track {
      background: rgba(139, 92, 246, 0.18);
      border-left-color: #a78cfa;
    }
    .track-left {
      display: flex;
      flex-direction: column;
    }
    .track-title {
      font-size: 0.85rem;
      font-weight: 500;
      color: white;
    }
    .track-artist {
      font-size: 0.65rem;
      color: #8a8aaa;
    }
    .track-duration {
      font-size: 0.7rem;
      color: #6d6d8a;
    }
    .playing-icon {
      color: #c084fc;
      font-size: 0.7rem;
      margin-left: 12px;
    }

    /* custom scroll */
    .playlist-area::-webkit-scrollbar {
      width: 4px;
    }
    .playlist-area::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
    }
    .playlist-area::-webkit-scrollbar-thumb {
      background: #a78cfa;
    }

    /* toast / snackbar */
    .toast-msg {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1a2f;
      backdrop-filter: blur(20px);
      padding: 8px 20px;
      border-radius: 40px;
      color: #c4b5fd;
      font-size: 0.75rem;
      z-index: 1000;
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast-msg.show {
      opacity: 1;
    }

    @media (max-width: 480px) {
      .art-frame {
        width: 170px;
        height: 170px;
      }
      .song-title {
        font-size: 1.2rem;
      }
      .ctrl {
        width: 42px;
        height: 42px;
      }
      .play-big {
        width: 55px;
        height: 55px;
      }
      .extra-row {
        gap: 8px;
      }
      .volume-wrap {
        padding: 2px 8px;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="player" id="musicPlayer">
  <!-- Header -->
  <div class="player-header">
    <div class="logo">
      <i class="fas fa-music"></i>
      <h1>Harmony Flow</h1>
    </div>
    <div class="badge-group">
      <span class="badge"><i class="fas fa-waveform"></i> HD</span>
      <span class="badge">8 Tracks</span>
    </div>
  </div>

  <!-- Visualizer -->
  <div class="visualizer" id="visualizer">
    <div class="viz-bar" style="height: 12px;"></div>
    <div class="viz-bar" style="height: 24px;"></div>
    <div class="viz-bar" style="height: 18px;"></div>
    <div class="viz-bar" style="height: 30px;"></div>
    <div class="viz-bar" style="height: 22px;"></div>
    <div class="viz-bar" style="height: 16px;"></div>
    <div class="viz-bar" style="height: 28px;"></div>
    <div class="viz-bar" style="height: 20px;"></div>
  </div>

  <!-- Album Art -->
  <div class="album-section">
    <div class="art-frame">
      <img id="albumCover" src="https://picsum.photos/id/29/300/300" alt="cover">
    </div>
  </div>

  <!-- Song details -->
  <div class="song-details">
    <div class="song-title" id="songTitle">Midnight Drive</div>
    <div class="song-artist" id="songArtist">Luna Wave</div>
  </div>

  <!-- Progress -->
  <div class="progress-area">
    <div class="progress-container" id="progressContainer">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-info">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>

  <!-- Main Controls -->
  <div class="controls">
    <button class="ctrl" id="shuffleBtn"><i class="fas fa-random"></i></button>
    <button class="ctrl" id="prevBtn"><i class="fas fa-step-backward"></i></button>
    <button class="ctrl play-big" id="playBtn"><i class="fas fa-play" id="playIcon"></i></button>
    <button class="ctrl" id="nextBtn"><i class="fas fa-step-forward"></i></button>
    <button class="ctrl" id="repeatBtn"><i class="fas fa-redo-alt"></i></button>
  </div>

  <!-- Extra features row -->
  <div class="extra-row">
    <div class="volume-wrap">
      <i class="fas fa-volume-down"></i>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
      <i class="fas fa-volume-up"></i>
    </div>
    <button class="speed-btn" id="speedBtn">1.0x</button>
    <button class="repeat-mode" id="repeatModeBtn"><i class="fas fa-sync-alt"></i> Mode</button>
    <button class="shuffle-mode" id="shuffleModeBtn"><i class="fas fa-random"></i> Off</button>
  </div>

  <!-- Playlist Area -->
  <div class="playlist-area">
    <div class="playlist-header">
      <span><i class="fas fa-list-ul"></i> Queue · Playlist</span>
      <span><i class="fas fa-headphones"></i> click to play</span>
    </div>
    <ul class="tracklist" id="tracklist"></ul>
  </div>
</div>

<div id="toastMsg" class="toast-msg"></div>

<script>
  // ---------- TRACKS DATA (8 songs, extended) ----------
  const tracks = [
    { id: 1, title: "Midnight Drive", artist: "Luna Wave", duration: "3:24", durationSec: 204, cover: "https://picsum.photos/id/104/300/300", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
    { id: 2, title: "Neon Lights", artist: "The Stellar Echoes", duration: "4:12", durationSec: 252, cover: "https://picsum.photos/id/100/300/300", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
    { id: 3, title: "Echoes in the Dark", artist: "Aurora Sky", duration: "3:56", durationSec: 236, cover: "https://picsum.photos/id/96/300/300", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
    { id: 4, title: "Golden Hour", artist: "Coastline", duration: "2:48", durationSec: 168, cover: "https://picsum.photos/id/15/300/300", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" },
    { id: 5, title: "Fading Memories", artist: "Eliot Park", duration: "5:03", durationSec: 303, cover: "https://picsum.photos/id/169/300/300", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" },
    { id: 6, title: "Rise Again", artist: "Nova Collective", duration: "3:35", durationSec: 215, cover: "https://picsum.photos/id/145/300/300", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3" },
    { id: 7, title: "City Rain", artist: "Midnight Pulse", duration: "4:01", durationSec: 241, cover: "https://picsum.photos/id/42/300/300", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3" },
    { id: 8, title: "Velvet Skies", artist: "Jasmine Veil", duration: "3:48", durationSec: 228, cover: "https://picsum.photos/id/22/300/300", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" }
  ];

  // DOM elements
  const audio = new Audio();
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const progressFill = document.getElementById('progressFill');
  const progressContainer = document.getElementById('progressContainer');
  const currentTimeSpan = document.getElementById('currentTime');
  const durationSpan = document.getElementById('duration');
  const songTitleEl = document.getElementById('songTitle');
  const songArtistEl = document.getElementById('songArtist');
  const albumCover = document.getElementById('albumCover');
  const volumeSlider = document.getElementById('volumeSlider');
  const repeatBtn = document.getElementById('repeatBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatModeBtn = document.getElementById('repeatModeBtn');
  const shuffleModeBtn = document.getElementById('shuffleModeBtn');
  const speedBtn = document.getElementById('speedBtn');
  const tracklistEl = document.getElementById('tracklist');
  const visualizerBars = document.querySelectorAll('.viz-bar');

  // player state
  let currentIndex = 0;
  let isPlaying = false;
  let repeatState = "none"; // "none", "one", "all"
  let shuffleActive = false;
  let playbackSpeed = 1.0;
  let originalOrder = [...tracks];
  let shuffledOrder = [...tracks];

  // helper: show toast
  function showToast(message) {
    const toast = document.getElementById('toastMsg');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // format sec to mm:ss
  function formatTime(sec) {
    if (isNaN(sec)) return "0:00";
    const mins = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${mins}:${s < 10 ? '0' : ''}${s}`;
  }

  // update active playlist UI
  function updateActivePlaylist() {
    const items = document.querySelectorAll('.track');
    const currentTrackObj = getCurrentTrack();
    items.forEach((item, idx) => {
      const trackData = getTrackByDisplayIndex(idx);
      if (trackData && currentTrackObj && trackData.id === currentTrackObj.id) {
        item.classList.add('active-track');
        const iconSpan = item.querySelector('.playing-icon i');
        if (iconSpan) iconSpan.className = isPlaying ? 'fas fa-waveform' : 'fas fa-play';
      } else {
        item.classList.remove('active-track');
        const iconSpan = item.querySelector('.playing-icon i');
        if (iconSpan) iconSpan.className = 'fas fa-music';
      }
    });
  }

  function getCurrentTrack() {
    const playlist = shuffleActive ? shuffledOrder : originalOrder;
    return playlist[currentIndex];
  }

  function getTrackByDisplayIndex(idx) {
    const playlist = shuffleActive ? shuffledOrder : originalOrder;
    return playlist[idx];
  }

  // load track by index
  function loadTrack(index) {
    const playlist = shuffleActive ? shuffledOrder : originalOrder;
    const track = playlist[index];
    if (!track) return;
    audio.src = track.src;
    songTitleEl.textContent = track.title;
    songArtistEl.textContent = track.artist;
    albumCover.src = track.cover;
    durationSpan.textContent = track.duration;
    audio.load();
    audio.playbackRate = playbackSpeed;
    progressFill.style.width = '0%';
    currentTimeSpan.textContent = "0:00";
    updateActivePlaylist();
    if (isPlaying) {
      audio.play().catch(e => console.log("autoplay blocked", e));
    }
    // start visualizer animation
    startVisualizer();
  }

  // visualizer random bars effect
  let vizInterval = null;
  function startVisualizer() {
    if (vizInterval) clearInterval(vizInterval);
    if (isPlaying) {
      vizInterval = setInterval(() => {
        visualizerBars.forEach(bar => {
          const newH = Math.floor(Math.random() * 28) + 8;
          bar.style.height = `${newH}px`;
        });
      }, 150);
    } else {
      if (vizInterval) clearInterval(vizInterval);
      visualizerBars.forEach(bar => bar.style.height = "12px");
    }
  }

  function playMusic() {
    audio.play();
    isPlaying = true;
    playIcon.classList.remove('fa-play');
    playIcon.classList.add('fa-pause');
    startVisualizer();
    updateActivePlaylist();
  }

  function pauseMusic() {
    audio.pause();
    isPlaying = false;
    playIcon.classList.remove('fa-pause');
    playIcon.classList.add('fa-play');
    if (vizInterval) clearInterval(vizInterval);
    visualizerBars.forEach(bar => bar.style.height = "12px");
    updateActivePlaylist();
  }

  function togglePlay() {
    if (isPlaying) pauseMusic();
    else playMusic();
  }

  function nextTrackLogic() {
    const playlist = shuffleActive ? shuffledOrder : originalOrder;
    if (repeatState === "one") {
      // replay same track
      audio.currentTime = 0;
      if (!isPlaying) playMusic();
      else audio.play();
      return;
    }
    let nextIdx = currentIndex + 1;
    if (nextIdx >= playlist.length) {
      if (repeatState === "all") {
        nextIdx = 0;
      } else {
        pauseMusic();
        return;
      }
    }
    currentIndex = nextIdx;
    loadTrack(currentIndex);
    if (isPlaying) playMusic();
    else playMusic();
  }

  function prevTrackLogic() {
    const playlist = shuffleActive ? shuffledOrder : originalOrder;
    let prevIdx = currentIndex - 1;
    if (prevIdx < 0) {
      if (repeatState === "all") prevIdx = playlist.length - 1;
      else prevIdx = 0;
    }
    currentIndex = prevIdx;
    loadTrack(currentIndex);
    if (isPlaying) playMusic();
    else playMusic();
  }

  // update progress + time
  function updateProgress() {
    if (audio.duration && !isNaN(audio.duration)) {
      const percent = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = `${percent}%`;
      currentTimeSpan.textContent = formatTime(audio.currentTime);
    }
  }

  function seek(e) {
    const rect = progressContainer.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const width = rect.width;
    const percent = x / width;
    if (audio.duration) {
      audio.currentTime = percent * audio.duration;
    }
  }

  function onTrackEnd() {
    if (repeatState === "one") {
      audio.currentTime = 0;
      playMusic();
      return;
    }
    const playlist = shuffleActive ? shuffledOrder : originalOrder;
    let next = currentIndex + 1;
    if (next >= playlist.length) {
      if (repeatState === "all") {
        currentIndex = 0;
        loadTrack(0);
        playMusic();
      } else {
        pauseMusic();
        currentIndex = 0;
      }
    } else {
      currentIndex = next;
      loadTrack(currentIndex);
      playMusic();
    }
  }

  // volume
  function setVolume(val) {
    audio.volume = val;
    volumeSlider.value = val;
  }

  // repeat mode change
  function cycleRepeatMode() {
    if (repeatState === "none") {
      repeatState = "one";
      repeatModeBtn.innerHTML = '<i class="fas fa-sync-alt"></i> 1';
      showToast("Repeat: Track loop");
    } else if (repeatState === "one") {
      repeatState = "all";
      repeatModeBtn.innerHTML = '<i class="fas fa-sync-alt"></i> All';
      showToast("Repeat: Playlist loop");
    } else {
      repeatState = "none";
      repeatModeBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Off';
      showToast("Repeat: Off");
    }
  }

  // Shuffle toggle
  function toggleShuffle() {
    shuffleActive = !shuffleActive;
    if (shuffleActive) {
      // create shuffled copy excluding current track but preserve current?
      let currentTrack = getCurrentTrack();
      let otherTracks = originalOrder.filter(t => t.id !== currentTrack.id);
      for (let i = otherTracks.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [otherTracks[i], otherTracks[j]] = [otherTracks[j], otherTracks[i]];
      }
      shuffledOrder = [currentTrack, ...otherTracks];
      currentIndex = 0;
      shuffleModeBtn.innerHTML = '<i class="fas fa-random"></i> On';
      showToast("Shuffle mode ON");
    } else {
      shuffledOrder = [...originalOrder];
      // map current index based on original track id
      const currentTrackId = getCurrentTrack().id;
      currentIndex = originalOrder.findIndex(t => t.id === currentTrackId);
      if (currentIndex === -1) currentIndex = 0;
      shuffleModeBtn.innerHTML = '<i class="fas fa-random"></i> Off';
      showToast("Shuffle mode OFF");
    }
    loadTrack(currentIndex);
    if (isPlaying) playMusic();
    renderPlaylist();
  }

  // Speed change
  const speeds = [0.75, 1.0, 1.25, 1.5];
  let speedIdx = 1;
  function changeSpeed() {
    speedIdx = (speedIdx + 1) % speeds.length;
    playbackSpeed = speeds[speedIdx];
    audio.playbackRate = playbackSpeed;
    speedBtn.textContent = `${playbackSpeed}x`;
    showToast(`Playback speed: ${playbackSpeed}x`);
  }

  // render playlist
  function renderPlaylist() {
    const playlist = shuffleActive ? shuffledOrder : originalOrder;
    tracklistEl.innerHTML = '';
    playlist.forEach((track, idx) => {
      const li = document.createElement('li');
      li.className = 'track';
      if (getCurrentTrack() && getCurrentTrack().id === track.id) li.classList.add('active-track');
      li.innerHTML = `
        <div class="track-left">
          <span class="track-title">${escapeHtml(track.title)}</span>
          <span class="track-artist">${escapeHtml(track.artist)}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="track-duration">${track.duration}</span>
          <span class="playing-icon"><i class="fas ${(getCurrentTrack() && getCurrentTrack().id === track.id && isPlaying) ? 'fa-waveform' : 'fa-music'}"></i></span>
        </div>
      `;
      li.addEventListener('click', () => {
        currentIndex = idx;
        loadTrack(currentIndex);
        if (isPlaying) playMusic();
        else playMusic();
      });
      tracklistEl.appendChild(li);
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // event listeners
  function bindEvents() {
    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', prevTrackLogic);
    nextBtn.addEventListener('click', nextTrackLogic);
    progressContainer.addEventListener('click', seek);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', onTrackEnd);
    volumeSlider.addEventListener('input', (e) => setVolume(parseFloat(e.target.value)));
    repeatModeBtn.addEventListener('click', cycleRepeatMode);
    shuffleModeBtn.addEventListener('click', toggleShuffle);
    speedBtn.addEventListener('click', changeSpeed);
    audio.addEventListener('loadedmetadata', () => {
      durationSpan.textContent = formatTime(audio.duration);
    });
  }

  // init
  function init() {
    originalOrder = [...tracks];
    shuffledOrder = [...tracks];
    shuffleActive = false;
    currentIndex = 0;
    repeatState = "none";
    playbackSpeed = 1.0;
    audio.volume = 0.7;
    volumeSlider.value = 0.7;
    audio.playbackRate = 1.0;
    bindEvents();
    renderPlaylist();
    loadTrack(0);
    isPlaying = false;
    playIcon.classList.remove('fa-pause');
    playIcon.classList.add('fa-play');
    repeatModeBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Off';
    shuffleModeBtn.innerHTML = '<i class="fas fa-random"></i> Off';
    speedBtn.textContent = "1.0x";
  }

  init();
</script>
</body>
</html>
